plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'app.cubic'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cubic.puzzle'
        minSdk 26
        targetSdk 34
        versionCode 101
        versionName '1.0.1-rebuild'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
