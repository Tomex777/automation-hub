name: Publish Cubic 1.0.0 Screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cubic-100-screenshots.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch validated API 36 captures
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2dac-8210-aebe-e2e3c36cf0d5/raw?se=2026-09-30T09%3A51%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=2d85ca61-84a1-5217-b7ff-986a98288e72&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T04%3A29%3A28Z&ske=2026-10-01T04%3A29%3A28Z&sks=b&skv=2026-02-06&sig=WIlhZd9y3mzwN8Ny4AEopkKBh9MU%2BhjJ6PhLjun9shs%3D'
        run: |
          set -euo pipefail
          mkdir -p /tmp/cubic-shots
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/cubic-shots.zip
          unzip -q /tmp/cubic-shots.zip -d /tmp/cubic-shots
          for file in             cubic-home.png             cubic-controls-sheet.png             cubic-3x3x5.png             cubic-9x9x9.png             cubic-guided-step.png             cubic-guided-solved.png; do
            test -s "/tmp/cubic-shots/$file"
          done

      - name: Add captures to public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload cubic-v1.0.0             /tmp/cubic-shots/cubic-home.png             /tmp/cubic-shots/cubic-controls-sheet.png             /tmp/cubic-shots/cubic-3x3x5.png             /tmp/cubic-shots/cubic-9x9x9.png             /tmp/cubic-shots/cubic-guided-step.png             /tmp/cubic-shots/cubic-guided-solved.png             --clobber
