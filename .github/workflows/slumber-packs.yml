name: Publish Slumber instrument packs

on:
  push:
    branches: [main]
    paths:
      - "slumber-packs/generate_packs.py"
      - ".github/workflows/slumber-packs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate packs
        run: python slumber-packs/generate_packs.py
      - name: Commit generated ZIPs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slumber-packs/*.zip
          if git diff --cached --quiet; then
            echo "No pack changes"
          else
            git commit -m "Publish Slumber instrument packs"
            git push
          fi
