name: Fetch APK Signing Tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-apk-signer.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify uber-apk-signer
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-signer
          curl --fail --location --retry 3             https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar             -o /tmp/apk-signer/uber-apk-signer-1.3.0.jar
          curl --fail --location --retry 3             https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/checksum-sha256.txt             -o /tmp/apk-signer/checksum-sha256.txt
          cd /tmp/apk-signer
          sha256sum -c checksum-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: /tmp/apk-signer/
          if-no-files-found: error
